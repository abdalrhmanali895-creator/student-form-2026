<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please fill in the following information.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number">
            <br><br>

            <label for="birthdate">Date of Birth:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            <br><br>

            <p>Gender:</p>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Information</legend>

            <label for="studentid">Student ID:</label>
            <input type="text" id="studentid" name="studentid"
                   placeholder="Enter your student ID">
            <br><br>

            <label for="department">Department:</label>

            <select id="department" name="department" required>
                <option value="">-- Select Department --</option>
                <option value="IT">Information Technology</option>
                <option value="CS">Computer Science</option>
                <option value="IS">Information Systems</option>
                <option value="Engineering">Engineering</option>
            </select>

            <br><br>

            <label for="year">Academic Year:</label>

            <select id="year" name="year" required>
                <option value="">-- Select Year --</option>
                <option value="First">First Year</option>
                <option value="Second">Second Year</option>
                <option value="Third">Third Year</option>
                <option value="Fourth">Fourth Year</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Skills and Interests</legend>

            <p>Select your skills:</p>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="cpp" name="skills" value="C++">
            <label for="cpp">C++</label>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>

            <br><br>

            <label for="hobbies">Hobbies and Interests:</label>
            <br>

            <textarea id="hobbies" name="hobbies" rows="4" cols="40"
                      placeholder="Write your hobbies and interests here"></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="country">Country:</label>
            <input type="text" id="country" name="country">
            <br><br>

            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <br><br>
        <input type="checkbox" id="terms" name="terms" value="accepted" required>
            <label for="terms">I confirm that the information provided is correct.</label>

        </fieldset>

        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
